[project]
name = "freelance-agent"
version = "0.1.0"
description = "Полуавтономный агент поиска и подготовки откликов на фриланс-заказы (статистика, научное редактирование, оформление)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.16,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fa = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
